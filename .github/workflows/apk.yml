name: Gerar APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q projeto.zip -d app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Montar o app
        working-directory: app/fio-de-navalha-app
        run: |
          npm install --legacy-peer-deps
          npx cap add android
          sed -i 's#</application>#<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/></application>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publicar o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/fio-de-navalha-app/android/app/build/outputs/apk/debug/app-debug.apk fio-de-navalha.apk
          gh release create "v${{ github.run_number }}" fio-de-navalha.apk --title "Fio de Navalha v${{ github.run_number }}" --notes "APK de teste"
